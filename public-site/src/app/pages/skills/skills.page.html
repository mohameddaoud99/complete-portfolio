<section class="section container" appReveal>
  <app-section-heading [title]="i18n.t('skills.title')" [subtitle]="i18n.t('skills.subtitle')" align="center" />

  @if (skills().length > 0) {
    <div class="skills-filter">
      <button
        type="button"
        class="skills-filter__chip"
        [class.skills-filter__chip--active]="activeCategory() === null"
        (click)="setCategory(null)"
      >
        {{ i18n.t('skills.filter.all') }}
      </button>
      @for (category of categories(); track category) {
        <button
          type="button"
          class="skills-filter__chip"
          [class.skills-filter__chip--active]="activeCategory() === category"
          (click)="setCategory(category)"
        >
          {{ category }}
        </button>
      }
    </div>

    <div class="skills-grid">
      @for (skill of filteredSkills(); track skill.id) {
        <div class="skill-card glass-panel" appReveal>
          <div class="skill-card__icon">
            <lucide-icon [img]="resolveIcon(skill.icon)" [size]="26" />
          </div>
          <h3>{{ skill.name }}</h3>
          <span class="skill-card__category">{{ skill.category }}</span>
          <div class="skill-card__bar">
            <div class="skill-card__bar-fill" [style.width.%]="skill.proficiency"></div>
          </div>
          <span class="skill-card__years">{{ skill.yearsExperience }} {{ i18n.t('skills.years') }}</span>
        </div>
      }
    </div>
  } @else {
    <div class="skills-grid">
      @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track item) {
        <app-skeleton height="9rem" radius="var(--radius-lg)" />
      }
    </div>
  }
</section>
