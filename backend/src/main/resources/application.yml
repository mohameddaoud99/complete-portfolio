server:
  #port: 8080
  port: ${PORT:8080}

  logging:
    level:
      com.portfolio: INFO

spring:
  application:
    name: portfolio-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:complete-portfolio-five.vercel.app,http://localhost:4200,http://localhost:4300,http://localhost:4000,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me}
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:./uploads}
    public-path: /media-files

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.portfolio: DEBUG
