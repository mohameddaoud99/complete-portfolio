<app-page-header title="Skills" subtitle="Manage the technologies and tools shown on your portfolio">
  <a pButton routerLink="/skills/new" icon="pi pi-plus" label="Add Skill"></a>
</app-page-header>

<div class="glass-panel skill-list__table">
  <p-table [value]="skills()" [loading]="loading()" [paginator]="true" [rows]="10" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Proficiency</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-skill>
      <tr>
        <td>{{ skill.name }}</td>
        <td><p-tag [value]="skill.category" /></td>
        <td><p-rating [ngModel]="skill.proficiency" [readonly]="true" [stars]="5" /></td>
        <td class="skill-list__actions">
          <button pButton type="button" icon="pi pi-pencil" [text]="true" (click)="edit(skill)"></button>
          <button pButton type="button" icon="pi pi-trash" severity="danger" [text]="true" (click)="confirmDelete(skill)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No skills yet. Click "Add Skill" to create one.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
