<app-page-header title="Experiences" subtitle="Manage your professional experience timeline">
  <a pButton routerLink="/experiences/new" icon="pi pi-plus" label="Add Experience"></a>
</app-page-header>

<div class="glass-panel experience-list__table">
  <p-table [value]="experiences()" [loading]="loading()" [paginator]="true" [rows]="10" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Role</th>
        <th>Company</th>
        <th>Period</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-experience>
      <tr>
        <td>{{ experience.role }}</td>
        <td>{{ experience.company }}</td>
        <td>{{ experience.startDate | date: 'MMM y' }} - {{ experience.endDate ? (experience.endDate | date: 'MMM y') : 'Present' }}</td>
        <td class="experience-list__actions">
          <button pButton type="button" icon="pi pi-pencil" [text]="true" (click)="edit(experience)"></button>
          <button pButton type="button" icon="pi pi-trash" severity="danger" [text]="true" (click)="confirmDelete(experience)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No experiences yet. Click "Add Experience" to create one.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
