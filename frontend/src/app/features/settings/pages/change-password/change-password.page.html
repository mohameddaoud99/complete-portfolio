<app-page-header title="Settings" subtitle="Manage your account security" />

<form [formGroup]="form" (ngSubmit)="submit()" class="form-panel glass-panel">
  <h3>Change password</h3>

  <div class="field">
    <label for="currentPassword">Current password</label>
    <p-password inputId="currentPassword" formControlName="currentPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" />
  </div>

  <div class="field">
    <label for="newPassword">New password</label>
    <p-password inputId="newPassword" formControlName="newPassword" [toggleMask]="true" styleClass="w-full" />
  </div>

  <div class="field">
    <label for="confirmPassword">Confirm new password</label>
    <p-password inputId="confirmPassword" formControlName="confirmPassword" [feedback]="false" [toggleMask]="true" styleClass="w-full" />
  </div>

  @if (errorMessage()) {
    <p class="change-password__error">{{ errorMessage() }}</p>
  }

  <button pButton type="submit" label="Update password" [loading]="saving()"></button>
</form>
