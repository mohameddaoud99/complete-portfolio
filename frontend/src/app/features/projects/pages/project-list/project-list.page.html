<app-page-header title="Projects" subtitle="Manage the projects showcased on your portfolio">
  <a pButton routerLink="/projects/new" icon="pi pi-plus" label="Add Project"></a>
</app-page-header>

<div class="glass-panel project-list__table">
  <p-table [value]="projects()" [loading]="loading()" [paginator]="true" [rows]="10" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Title</th>
        <th>Tech stack</th>
        <th>Featured</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-project>
      <tr>
        <td>{{ project.title }}</td>
        <td>{{ project.techStack }}</td>
        <td>
          @if (project.featured) {
            <p-tag value="Featured" severity="success" />
          }
        </td>
        <td class="project-list__actions">
          <button pButton type="button" icon="pi pi-pencil" [text]="true" (click)="edit(project)"></button>
          <button pButton type="button" icon="pi pi-trash" severity="danger" [text]="true" (click)="confirmDelete(project)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">No projects yet. Click "Add Project" to create one.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
